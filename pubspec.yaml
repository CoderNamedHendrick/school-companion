publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.9
  firebase_core: ^4.15.0
  kaisel: ^1.1.0
  flutter_riverpod: ^3.4.3
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
