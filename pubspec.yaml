  firebase_messaging: ^16.7.0
  intl: ^0.20.3
  file_picker: ^13.1.0
  url_launcher: ^6.3.2
  http: ^1.6.0
  firebase_app_check: ^0.4.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
